services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:18-alpine
    container_name: traclytag-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracelytag}
      POSTGRES_USER: ${POSTGRES_USER:-tracelytag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelytag_secret_2026}
    volumes:
      - tracelytag-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracelytag} -d ${POSTGRES_DB:-tracelytag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 2. In-Docker Local & VPS Mail Server (Mailpit: SMTP & Web Preview)
  mailpit:
    image: axllent/mailpit:latest
    container_name: traclytag-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server port
      - "8025:8025" # Webmail UI port
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # 3. Backend API Server Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: traclytag-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tracelytag}:${POSTGRES_PASSWORD:-tracelytag_secret_2026}@db:5432/${POSTGRES_DB:-tracelytag}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./artifacts/api-server/uploads:/app/artifacts/api-server/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. Frontend Web Client Service (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: traclytag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tracelytag-postgres:
