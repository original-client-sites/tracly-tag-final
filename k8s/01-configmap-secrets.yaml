apiVersion: v1
kind: ConfigMap
metadata:
  name: tracelytag-config
  namespace: tracelytag
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_URL: "redis://tracelytag-redis-svc.tracelytag.svc.cluster.local:6379"
  # Route database traffic through PgBouncer connection pooler
  DATABASE_HOST: "tracelytag-postgres-svc.tracelytag.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "tracelytag"
  # Mailpit SMTP Configuration (Intra-cluster Kubernetes service)
  SMTP_HOST: "tracelytag-mailpit-svc.tracelytag.svc.cluster.local"
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: tracelytag-secrets
  namespace: tracelytag
type: Opaque
stringData:
  SESSION_SECRET: "tracelytag-production-secure-session-key-xyz-987654987"
  DATABASE_USER: "tracelytag"
  DATABASE_PASSWORD: "tracelytag_secret_2026"
  DATABASE_URL: "postgresql://tracelytag:tracelytag_secret_2026@tracelytag-postgres-svc.tracelytag.svc.cluster.local:5432/tracelytag"
  API_AUTH_TOKEN: "tracly_auth_token_secret_321"
  SUPERMASTER_USERNAME: "supermaster"
  SUPERMASTER_PASSWORD: "kp_dk@2026"
