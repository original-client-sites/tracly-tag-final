apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracelytag-ingress
  namespace: tracelytag
  annotations:
    # SSL auto-provisioning via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Multi-tenant burst and rate protection
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Enable gzip compression
    nginx.ingress.kubernetes.io/enable-real-ip: "true"
spec:
  rules:
    # 1. Direct VPS IP Access (e.g. visiting http://<VPS_IP>/ in browser)
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tracelytag-backend-svc
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelytag-frontend-svc
                port:
                  number: 80
    # 2. Main Application & Wildcard Subdomains for Multi-Tenant Branding
    - host: app.tracelytag.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tracelytag-backend-svc
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelytag-frontend-svc
                port:
                  number: 80
    # 3. Public API & Verification Endpoint (Mobile Scans & Partner Integrations)
    - host: api.tracelytag.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelytag-backend-svc
                port:
                  number: 3000
    # 4. Mailpit Webmail UI (Development & Testing)
    - host: mail.tracelytag.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelytag-mailpit-svc
                port:
                  number: 8025

