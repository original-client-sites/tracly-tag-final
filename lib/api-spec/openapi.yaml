openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TraclyTag Admin Panel API

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
  - name: auth
  - name: companies
  - name: users
  - name: products
  - name: locations
  - name: batches
  - name: codes
  - name: reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- AUTH ----------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new company and user administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registration successful and user logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Validation error or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- COMPANIES (master only) ----------
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /companies/my-company:
    get:
      operationId: getMyCompany
      tags: [companies]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMyCompany
      tags: [companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyUrl:
                  type: ["string", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/my-company/regenerate-api-key:
    post:
      operationId: regenerateCompanyApiKey
      tags: [companies]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{id}:
    delete:
      operationId: deleteCompany
      tags: [companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    put:
      operationId: updateCompany
      tags: [companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"


  # ---------- USERS ----------
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"




  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    put:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---------- LOCATIONS ----------
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /locations/{id}:
    delete:
      operationId: deleteLocation
      tags: [locations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---------- BATCHES ----------
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
    post:
      operationId: createBatch
      tags: [batches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
  /batches/{id}:
    delete:
      operationId: deleteBatch
      tags: [batches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---------- CODES ----------
  /codes:
    get:
      operationId: listCodes
      tags: [codes]
      parameters:
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/CodeLevel"
        - name: batchId
          in: query
          schema:
            type: integer
        - name: productId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Code"
    post:
      operationId: generateCodes
      tags: [codes]
      summary: Generate a quantity of GS1 codes for a batch at a given level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCodesBody"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCodesResponse"
  /codes/{id}/map:
    post:
      operationId: mapCode
      tags: [codes]
      summary: Mark a code as mapped to a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapCodeBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Code"

  # ---------- REPORTS ----------
  /reports/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [reports]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/stock:
    get:
      operationId: getStockReport
      tags: [reports]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockRow"
  /reports/product:
    get:
      operationId: getProductReport
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductReportRow"
  /reports/shipper-summary:
    get:
      operationId: getShipperSummary
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShipperSummaryRow"
  /reports/pallet-summary:
    get:
      operationId: getPalletSummary
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PalletSummaryRow"
  /reports/marked-by:
    get:
      operationId: getMarkedByLog
      tags: [reports]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarkedByEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Role:
      type: string
      enum: [super_master, master, admin, client_admin, operator]

    LoginBody:
      type: object
      properties:
        username:
          type: string
          description: Username or email address
        password:
          type: string
      required: [username, password]

    RegisterBody:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        companyName:
          type: string
        companyEmail:
          type: string
        companyWebsiteUrl:
          type: string
      required: [username, email, password, phone, companyName, companyEmail, companyWebsiteUrl]

    AuthSession:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        companyUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        enabledModules:
          type: string
        isImpersonating:
          type: boolean
        impersonatorUsername:
          type: string
      required: [id, username, email, role, companyId, companyName, isActive, enabledModules]

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        address:
          type: string
        gstin:
          type: ["string", "null"]
          pattern: "^[0-9]{2}[a-zA-Z0-9]{10}[a-zA-Z0-9][zZ][a-zA-Z0-9]?$"
        companyUrl:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        pan:
          type: ["string", "null"]
        cin:
          type: ["string", "null"]
        msmeRegistrationNo:
          type: ["string", "null"]
        fssaiLicenseNo:
          type: ["string", "null"]
        drugLicenseNo:
          type: ["string", "null"]
        iecCode:
          type: ["string", "null"]
        companyPrefix:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, address, gstin, createdAt]

    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        address:
          type: string
        gstin:
          type: ["string", "null"]
          pattern: "^[0-9]{2}[a-zA-Z0-9]{10}[a-zA-Z0-9][zZ][a-zA-Z0-9]?$"
        companyUrl:
          type: ["string", "null"]
        pan:
          type: ["string", "null"]
        cin:
          type: ["string", "null"]
        msmeRegistrationNo:
          type: ["string", "null"]
        fssaiLicenseNo:
          type: ["string", "null"]
        drugLicenseNo:
          type: ["string", "null"]
        iecCode:
          type: ["string", "null"]
        companyPrefix:
          type: ["string", "null"]
      required: [name, email, address]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/Role"
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        isActive:
          type: boolean
        enabledModules:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, phone, role, companyId, companyName, isActive, enabledModules, createdAt]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        password:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        companyId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        enabledModules:
          type: string
      required: [username, email, password, role]

    UpdateUserBody:
      type: object
      properties:
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/Role"
        isActive:
          type: boolean
        enabledModules:
          type: string
        password:
          type: string
        companyId:
          type: ["integer", "null"]


    Product:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        skuId:
          type: string
        name:
          type: string
        skuSize:
          type: string
        marketedBy:
          type: string
        sapDescription:
          type: ["string", "null"]
        gtin:
          type: ["string", "null"]
        mrp:
          type: number
        registrationNo:
          type: ["string", "null"]
        hsnCode:
          type: ["string", "null"]
        gstRate:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        weightValue:
          type: ["number", "null"]
        weightUnit:
          type: ["string", "null"]
        packagingType:
          type: ["string", "null"]
        shelfLifeDays:
          type: ["integer", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        isGs1Compliant:
          type: ["boolean", "null"]
        l1Size:
          type: integer
          description: Units per 1st level inner pack
        l2Size:
          type: integer
          description: 1st level packs per 2nd level inner pack
        shipperSize:
          type: integer
          description: 2nd level packs per shipper
        cautionLogoUrl:
          type: ["string", "null"]
        productLogoUrl:
          type: ["string", "null"]
        labelPdfUrl:
          type: ["string", "null"]
        expiryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - skuId
        - name
        - skuSize
        - marketedBy
        - mrp
        - l1Size
        - l2Size
        - shipperSize
        - expiryDate
        - createdAt

    CreateProductBody:
      type: object
      properties:
        skuId:
          type: string
        name:
          type: string
        skuSize:
          type: string
        marketedBy:
          type: string
        sapDescription:
          type: ["string", "null"]
        gtin:
          type: ["string", "null"]
          description: 14 digit GTIN
        mrp:
          type: number
        registrationNo:
          type: ["string", "null"]
        hsnCode:
          type: ["string", "null"]
        gstRate:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        weightValue:
          type: ["number", "null"]
        weightUnit:
          type: ["string", "null"]
        packagingType:
          type: ["string", "null"]
        shelfLifeDays:
          type: ["integer", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        isGs1Compliant:
          type: ["boolean", "null"]
        l1Size:
          type: integer
        l2Size:
          type: integer
        shipperSize:
          type: integer
        cautionLogoUrl:
          type: ["string", "null"]
        productLogoUrl:
          type: ["string", "null"]
        labelPdfUrl:
          type: ["string", "null"]
        expiryDate:
          type: string
          format: date
      required:
        - skuId
        - name
        - skuSize
        - marketedBy
        - mrp
        - l1Size
        - l2Size
        - shipperSize
        - expiryDate

    Location:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        locationType:
          type: string
        uniqueName:
          type: string
        locationName:
          type: string
        contactNo:
          type: string
        state:
          type: string
        city:
          type: string
        address:
          type: string
        gln:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - locationType
        - uniqueName
        - locationName
        - contactNo
        - state
        - city
        - address
        - createdAt

    CreateLocationBody:
      type: object
      properties:
        locationType:
          type: string
        uniqueName:
          type: string
        locationName:
          type: string
        contactNo:
          type: string
        state:
          type: string
        city:
          type: string
        address:
          type: string
        gln:
          type: ["string", "null"]
      required:
        - locationType
        - uniqueName
        - locationName
        - contactNo
        - state
        - city
        - address

    Batch:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        batchNumber:
          type: string
        mfgDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - productName
        - batchNumber
        - mfgDate
        - expiryDate
        - createdAt

    CreateBatchBody:
      type: object
      properties:
        productId:
          type: integer
        batchNumber:
          type: string
        mfgDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
      required: [productId, batchNumber, mfgDate, expiryDate]

    CodeLevel:
      type: string
      enum: [unit, l1, l2, shipper, pallet]

    Code:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        batchId:
          type: ["integer", "null"]
        batchNumber:
          type: ["string", "null"]
        level:
          $ref: "#/components/schemas/CodeLevel"
        rawString:
          type: string
          description: Raw GS1 string with FNC1 (ASCII 232) where applicable, no brackets
        serialNumber:
          type: ["string", "null"]
        ssccCode:
          type: ["string", "null"]
        mapped:
          type: boolean
        mappedAt:
          type: ["string", "null"]
          format: date-time
        mappedByUserId:
          type: ["integer", "null"]
        mappedByUsername:
          type: ["string", "null"]
        locationId:
          type: ["integer", "null"]
        locationName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        mfgDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        marketedBy:
          type: ["string", "null"]
        registrationNo:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        companyAddress:
          type: ["string", "null"]
        companyUrl:
          type: ["string", "null"]
      required:
        - id
        - productId
        - productName
        - batchId
        - batchNumber
        - level
        - rawString
        - serialNumber
